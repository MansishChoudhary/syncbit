spring.application.name=syncbit

# 8080 is often taken by something else on a dev machine (it was here) - pick a quieter default
server.port=8091

# schema.sql is applied by IngestService itself (drop+recreate is part of every ingest run),
# not by Spring's own SQL init mechanism, so this stays off.
spring.sql.init.mode=never

spring.ai.openai.api-key=${SARVAM_API_KEY:placeholder-not-set}
spring.ai.openai.chat.options.model=sarvam-105b
spring.ai.openai.chat.options.temperature=0.3
# Spring AI 2.0.1 wraps the official OpenAI Java SDK (com.openai:openai-java-core), whose
# own default baseUrl is "https://api.openai.com/v1" - the /v1 is part of baseUrl itself,
# not appended separately. So Sarvam's given URL is used as-is, unmodified.
spring.ai.openai.base-url=https://api.sarvam.ai/v1
# sarvam-105b is a reasoning model (verbose hidden chain-of-thought, confirmed via direct
# API test: 1176 completion tokens for a trivial one-word prompt) - default 60s
# timeout x 3 retries was cutting responses off mid-stream. Longer timeout, fewer retries
# so a genuinely slow-but-working call doesn't multiply its own wait.
spring.ai.openai.chat.timeout=180s
spring.ai.openai.chat.max-retries=1
# Root cause confirmed (not just format rigidity): a direct API test showed this model's
# hidden reasoning got stuck deliberating over "breaching on 0 of the last 3 days" as
# self-contradictory, burning 3768 of 4096 max-tokens on reasoning alone before it
# (barely) finished - a coin-flip at that margin. Fixed the ambiguous phrasing in
# LlmAdapter and widened the ceiling so a still-verbose pass has real headroom.
spring.ai.openai.chat.options.max-tokens=8192

spring.datasource.url=jdbc:postgresql://localhost:5433/hackathon_db
spring.datasource.username=postgres
spring.datasource.password=secret
spring.datasource.driver-class-name=org.postgresql.Driver