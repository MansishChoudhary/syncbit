<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SyncBit — Morning Brief</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900">
<nav class="bg-slate-900 text-white px-6 py-3 flex items-center gap-6">
  <span class="font-semibold">SyncBit</span>
  <a href="/index.html" class="text-sm font-medium underline">Morning Brief</a>
  <a href="/leadership.html" class="text-sm text-slate-300 hover:text-white">Leadership Brief</a>
  <a href="/drafts.html" class="text-sm text-slate-300 hover:text-white">Action Queue</a>
</nav>

<main class="max-w-4xl mx-auto p-6">
  <div class="flex items-center justify-between mb-6">
    <div>
      <h1 class="text-2xl font-bold">Morning Brief</h1>
      <p class="text-slate-500 text-sm">Signals the system already found — nothing to query, nothing to ask for.</p>
    </div>
    <div class="flex items-center gap-3">
      <select id="tenant" class="border rounded px-2 py-1 text-sm"></select>
      <input id="date" type="date" class="border rounded px-2 py-1 text-sm">
    </div>
  </div>

  <div id="signals" class="space-y-4"></div>
  <div id="empty" class="hidden text-center text-slate-400 py-16">No signals for this date.</div>
</main>

<script>
const $ = (id) => document.getElementById(id);
let META = null;

async function loadMeta() {
  META = await (await fetch('/api/meta')).json();
  $('date').value = META.latestSignalDate;
  const sel = $('tenant');
  sel.innerHTML = '<option value="">All tenants</option>' +
    META.tenants.map(t => `<option value="${t}">${t}</option>`).join('');
  sel.addEventListener('change', loadSignals);
  $('date').addEventListener('change', loadSignals);
}

function fmtNum(v) {
  if (v === null || v === undefined) return '—';
  const n = Number(v);
  return Number.isInteger(n) ? n.toString() : n.toFixed(4).replace(/0+$/, '').replace(/\.$/, '');
}

function badge(text, cls) {
  return `<span class="inline-block text-xs font-semibold px-2 py-0.5 rounded ${cls}">${text}</span>`;
}

async function loadSignals() {
  const date = $('date').value;
  const tenant = $('tenant').value;
  const url = `/api/briefs/morning?date=${date}` + (tenant ? `&tenantId=${tenant}` : '');
  const signals = await (await fetch(url)).json();
  const container = $('signals');
  $('empty').classList.toggle('hidden', signals.length > 0);
  container.innerHTML = signals.map(s => `
    <div class="bg-white border rounded-lg p-4 shadow-sm">
      <div class="flex items-start justify-between gap-4">
        <div>
          <div class="flex items-center gap-2 mb-1">
            ${s.safetyFlag ? badge('SAFETY', 'bg-red-100 text-red-700') : ''}
            ${s.persistenceDays > 0 ? badge(s.persistenceDays + 1 + ' consecutive days', 'bg-amber-100 text-amber-700') : badge('first occurrence', 'bg-slate-100 text-slate-500')}
            <span class="text-xs text-slate-400">${s.tenantId} · ${s.office || ''} · ${s.mode || ''}</span>
          </div>
          <h2 class="font-semibold text-lg">${s.entityId} — ${s.metricName}</h2>
          <p class="text-sm text-slate-600 mt-1">
            Observed <strong>${fmtNum(s.observedValue)}</strong>
            vs ${s.referenceType || 'baseline'} <strong>${fmtNum(s.referenceValue)}</strong>
          </p>
        </div>
        <a href="/evidence.html?id=${s.signalId}" class="shrink-0 text-sm font-medium text-blue-600 hover:underline whitespace-nowrap">View Evidence →</a>
      </div>
      <p class="text-sm text-slate-700 mt-3 border-t pt-3">${s.narrative ? s.narrative : '<em class="text-slate-400">Narrative not generated yet.</em>'}</p>
    </div>
  `).join('');
}

loadMeta().then(loadSignals);
</script>
</body>
</html>
