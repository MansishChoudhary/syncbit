<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SyncBit — Action Queue</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900">
<nav class="bg-slate-900 text-white px-6 py-3 flex items-center gap-6">
  <span class="font-semibold">SyncBit</span>
  <a href="/index.html" class="text-sm text-slate-300 hover:text-white">Morning Brief</a>
  <a href="/leadership.html" class="text-sm text-slate-300 hover:text-white">Leadership Brief</a>
  <a href="/drafts.html" class="text-sm font-medium underline">Action Queue</a>
</nav>

<main class="max-w-3xl mx-auto p-6">
  <div class="flex items-center justify-between mb-2">
    <h1 class="text-2xl font-bold">Action Review Queue</h1>
    <div class="flex gap-2 text-sm">
      <button data-status="draft" class="tab px-3 py-1 rounded bg-slate-900 text-white">Pending</button>
      <button data-status="approved" class="tab px-3 py-1 rounded bg-slate-200">Approved</button>
      <button data-status="rejected" class="tab px-3 py-1 rounded bg-slate-200">Rejected</button>
    </div>
  </div>
  <div class="bg-amber-50 border border-amber-200 text-amber-800 text-sm rounded px-3 py-2 mb-4">
    Every draft below was generated by the model, with evidence attached, and is never sent automatically. Nothing leaves this system until you click Approve.
  </div>

  <div id="drafts" class="space-y-4"></div>
  <div id="empty" class="hidden text-center text-slate-400 py-16">Nothing here.</div>
</main>

<script>
const $ = (id) => document.getElementById(id);
let currentStatus = 'draft';

async function loadDrafts() {
  const drafts = await (await fetch(`/api/drafts?status=${currentStatus}`)).json();
  const container = $('drafts');
  $('empty').classList.toggle('hidden', drafts.length > 0);
  container.innerHTML = drafts.map(d => `
    <div class="bg-white border rounded-lg p-4 shadow-sm">
      <div class="flex items-start justify-between gap-4">
        <div>
          <p class="text-xs text-slate-400">${d.tenantId} · to ${d.recipientVendorId} · evidence: ${d.evidenceRef}
            <a href="/evidence.html?id=${d.signalId}" class="text-blue-600 hover:underline">(view)</a>
          </p>
          <h2 class="font-semibold">${d.subject}</h2>
        </div>
        ${currentStatus === 'draft' ? `
          <div class="flex gap-2 shrink-0">
            <button onclick="act(${d.draftId}, 'approve')" class="bg-green-600 text-white text-sm px-3 py-1 rounded">Approve</button>
            <button onclick="act(${d.draftId}, 'reject')" class="bg-slate-200 text-sm px-3 py-1 rounded">Reject</button>
          </div>` : `<span class="text-xs font-semibold uppercase text-slate-400">${d.status}</span>`}
      </div>
      <p class="text-sm text-slate-700 mt-3 border-t pt-3 whitespace-pre-wrap">${d.body}</p>
    </div>
  `).join('');
}

async function act(id, action) {
  await fetch(`/api/drafts/${id}/${action}`, { method: 'POST' });
  loadDrafts();
}

document.querySelectorAll('.tab').forEach(btn => btn.addEventListener('click', () => {
  currentStatus = btn.dataset.status;
  document.querySelectorAll('.tab').forEach(b => b.className = 'tab px-3 py-1 rounded bg-slate-200');
  btn.className = 'tab px-3 py-1 rounded bg-slate-900 text-white';
  loadDrafts();
}));

loadDrafts();
</script>
</body>
</html>
